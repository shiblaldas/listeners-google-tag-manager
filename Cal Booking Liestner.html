<script>
window.addEventListener('message', function(event) {

    if (event.origin !== 'https://app.cal.com') {
        return;
    }

    if (
        event.data &&
        event.data.originator === 'CAL' &&
        event.data.fullType === 'CAL::bookingSuccessful'
    ) {

        var payload = event.data.data || {};
        var booking = payload.booking || {};
        var responses = booking.responses || {};
        var organizer = payload.organizer || {};
        var eventType = payload.eventType || {};

        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
            event: 'cal_booking_successful',

            inputs: responses,

            booking_id: booking.id || '',
            booking_status: booking.status || '',
            booking_title: booking.title || '',

            booking_start_time: booking.startTime || '',
            booking_end_time: booking.endTime || '',


            organizer_name: organizer.name || '',
            organizer_email: organizer.email || '',
            organizer_timezone: organizer.timeZone || ''
        });

        console.log('Cal Booking Success', booking);
    }
});
</script>
